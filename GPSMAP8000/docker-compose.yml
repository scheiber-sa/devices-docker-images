version: '3.8'

services:
  gpsmap8000:
    image: jkientz/scheiber-garmin-gpsmap8000:latest
    container_name: gpsmap8000
    
    # Expose ports
    ports:
      - "6081:6081"   # noVNC web interface
    
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    # Keep container running
    stdin_open: true
    tty: true
    
    # Use host network for better performance (optional)
    # network_mode: "host"
    
    # Restart policy
    restart: unless-stopped
    
    # Health check (optional)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6081/vnc.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
